<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Speech</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
        }
        .tts-container {
            background: #2b2b40;
            padding: 5%;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            width: 95vw;
            height: 90vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h2 {
            margin: 0 0 10px 0;
            color: #00d2ff;
            font-size: 5vh;
            text-align: center;
            letter-spacing: 1px;
        }
        textarea {
            width: 100%;
            flex-grow: 1;
            background: #1e1e2f;
            border: 2px solid #444;
            border-radius: 12px;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            resize: none;
            font-size: 24px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 15px;
        }
        textarea:focus { border-color: #00d2ff; }
        .controls { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        select {
            width: 100%;
            background: #1e1e2f;
            border: 2px solid #444;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
        }
        button {
            width: 100%;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 18px;
            background: #00d2ff;
            color: #1e1e2f;
        }
        button:hover { background: #00b4dc; }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="tts-container">
        <h2>TT Speech</h2>
        <textarea id="text-input" placeholder="এখানে বাংলায় অথবা ইংরেজিতে লিখুন..."></textarea>
        
        <div class="controls">
            <select id="voice-select">
                <option value="bn-BD">Bangla (Bangladesh) 🇧🇩</option>
                <option value="en-US">English (United States) 🇺🇸</option>
                <option value="en-GB">English (United Kingdom) 🇬🇧</option>
            </select>
            
            <button id="speak-btn">Generate & Play 🔊</button>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const speakBtn = document.getElementById('speak-btn');

        speakBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            const lang = voiceSelect.value;

            if (text === '') { 
                alert('Please type some text first!'); 
                return; 
            }

            // Check if the browser supports the native Web Speech API
            if ('speechSynthesis' in window) {
                // Stop any speech currently playing
                window.speechSynthesis.cancel();
                
                speakBtn.innerText = "Generating...";
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;

                // Set up visual state updates based on audio player tracking
                utterance.onstart = () => { speakBtn.innerText = "Playing... 🔊"; };
                utterance.onend = () => { speakBtn.innerText = "Generate & Play 🔊"; };
                utterance.onerror = () => { 
                    alert('Speech player issue. Please try again.');
                    speakBtn.innerText = "Generate & Play 🔊"; 
                };

                // Play the sound instantly using your browser's system audio
                window.speechSynthesis.speak(utterance);
            } else {
                alert('Your browser does not support speech playback inside this frame.');
            }
        });
    </script>
</body>
</html>
