<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TT Speech</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
        }
        .tts-container {
            background: #2b2b40;
            padding: 5%;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            width: 95vw;
            height: 90vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h2 {
            margin: 0 0 10px 0;
            color: #00d2ff;
            font-size: 5vh;
            text-align: center;
            letter-spacing: 1px;
        }
        textarea {
            width: 100%;
            flex-grow: 1;
            background: #1e1e2f;
            border: 2px solid #444;
            border-radius: 12px;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
            resize: none;
            font-size: 24px;
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 15px;
        }
        textarea:focus { border-color: #00d2ff; }
        .controls { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        select {
            width: 100%;
            background: #1e1e2f;
            border: 2px solid #444;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            box-sizing: border-box;
            outline: none;
        }
        .btn-group { display: flex; gap: 15px; width: 100%; }
        button {
            flex: 1;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 18px;
        }
        button:active { transform: scale(0.98); }
        #speak-btn { background: #00d2ff; color: #1e1e2f; }
        #speak-btn:hover { background: #00b4dc; }
        #download-btn { background: #2ecc71; color: #fff; }
        #download-btn:hover { background: #27ae60; }
    </style>
</head>
<body>

    <div class="tts-container">
        <h2>TT Speech</h2>
        <textarea id="text-input" placeholder="এখানে বাংলায় অথবা ইংরেজিতে লিখুন..."></textarea>
        
        <div class="controls">
            <select id="voice-select">
                <option value="bn-BD">Bangla (Natural Voice) 🇧🇩</option>
                <option value="en-US">English (US Male) 🇺🇸</option>
                <option value="en-GB">English (UK Female) 🇬🇧</option>
            </select>
            
            <div class="btn-group">
                <button id="speak-btn">Generate & Play 🔊</button>
                <button id="download-btn">Download 📥</button>
            </div>
        </div>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voice-select');
        const speakBtn = document.getElementById('speak-btn');
        const downloadBtn = document.getElementById('download-btn');
        let currentAudio = null;

        // Uses a highly-stable, open text-to-speech engine endpoint that bypasses CORS limits
        function getTtsUrl(text, lang) {
            return `https://translate.google.com/translate_tts?ie=UTF-8&tl=${lang}&client=tw-ob&q=${encodeURIComponent(text)}`;
        }

        speakBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            const lang = voiceSelect.value;
            if (text === '') { alert('Please type some text first!'); return; }
            
            // Web Speech API fallback: works directly inside secure iframes flawlessly
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                speakBtn.innerText = "Generating...";
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                
                utterance.onstart = () => { speakBtn.innerText = "Playing... 🔊"; };
                utterance.onend = () => { speakBtn.innerText = "Generate & Play 🔊"; };
                utterance.onerror = () => { speakBtn.innerText = "Generate & Play 🔊"; };
                
                window.speechSynthesis.speak(utterance);
            } else {
                // Background fallback method if speech engines fail
                if (currentAudio) currentAudio.pause();
                speakBtn.innerText = "Generating...";
                currentAudio = new Audio(getTtsUrl(text, lang.split('-')[0]));
                currentAudio.onplaying = () => { speakBtn.innerText = "Playing... 🔊"; };
                currentAudio.onended = () => { speakBtn.innerText = "Generate & Play 🔊"; };
                currentAudio.play().catch(() => { speakBtn.innerText = "Generate & Play 🔊"; });
            }
        });

        downloadBtn.addEventListener('click', () => {
            const text = textInput.value.trim();
            const lang = voiceSelect.value.split('-')[0]; // Grabs simple code like 'bn' or 'en'
            if (text === '') return;
            
            const downloadUrl = getTtsUrl(text, lang);
            const newWindow = window.open(downloadUrl, '_blank');
            setTimeout(() => { if (newWindow) newWindow.close(); }, 1200);
        });
    </script>
</body>
</html>
